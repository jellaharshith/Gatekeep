[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatekeep"
version = "0.1.0"
description = "Red-team benchmark and tool-layer enforcement gateway for AI SOC agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harshith" }]
keywords = ["ai-security", "prompt-injection", "soc", "llm-agents", "red-team", "owasp-agentic"]
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gatekeep = "gatekeep.cli:main"

[tool.setuptools.packages.find]
include = ["gatekeep*"]

[tool.setuptools.package-data]
gatekeep = ["scenarios/corpus/*.yaml", "guard/policies/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
